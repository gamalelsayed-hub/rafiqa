name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk rafiqa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rafiqa-apk
          path: rafiqa.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: رفيقة 1.0.${{ github.run_number }}
          body: |
            نسخة أندرويد من تطبيق رفيقة.
            نزّلي ملف rafiqa.apk من تحت، وافتحيه على الموبايل، ووافقي على «التثبيت من مصادر غير معروفة».
          files: rafiqa.apk
